name: Android CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test NOX - Game Space
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Keystore & Environment
        run: |
          # Prepare debug keystore if not present for CI build
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          # Prepare release upload keystore if not present so release AAB builds cleanly in CI
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NOX Game Space,O=NOX,C=US"
          fi
          # Ensure .env placeholder exists for buildConfig/secrets plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Ensure Executable Permissions
        run: |
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: Build Release App Bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew bundleRelease --no-configuration-cache

      - name: Prune Old Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Deleting previous artifacts to prevent hitting storage quota..."
          ARTIFACT_IDS=$(gh api -X GET "/repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting artifact ID: $id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null || true
          done

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NoxGameSpace-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxGameSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
